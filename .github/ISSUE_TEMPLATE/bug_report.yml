name: Bug report
description: Report a reproducible PauseMeow problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PauseMeow. Please avoid including private information.
  - type: input
    id: version
    attributes:
      label: PauseMeow version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (X11)
        - Linux (Wayland)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating-system version and desktop environment
      placeholder: Windows 11 24H2, or Fedora 43 with KDE Plasma 6
    validations:
      required: true
  - type: input
    id: monitors
    attributes:
      label: Monitor count, layout, and scaling
      placeholder: Two monitors, side by side, 100% and 150% scaling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Tell us exactly what to do to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Attach only material that does not expose private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I checked for an existing report of this problem.
          required: true
        - label: I removed private information from attachments and logs.
          required: true
