id: com.vladmas.PauseMeow
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: pausemeow

build-options:
  no-debuginfo: true
  strip: true

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: pausemeow
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .qt
          - .tools
          - artifacts
          - build
          - build-*
          - dist
